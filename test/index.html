<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>KINOCEKH | Night Color Fitting</title>
    
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@500;700;800&display=block" rel="stylesheet">
    
    <style>
        /* --- БАЗА (DARK ONLY) --- */
        :root {
            --font-main: 'Montserrat', sans-serif;
            --bg-color: #0F0F11;
            --text-primary: #FFFFFF;
            --text-secondary: #9aa0a6;
            
            /* СЖАТЫЕ КАРТОЧКИ */
            --card-bg: #1C1C1E;
            --card-border: #2C2C2E;
            
            /* Цвет акцента (меняется JS) */
            --accent-color: #D4AF37; 
        }

        body {
            margin: 0; padding: 0; background: var(--bg-color); color: var(--text-primary);
            font-family: var(--font-main);
            overflow: hidden; -webkit-font-smoothing: antialiased;
        }

        #app { padding: 16px; height: 100vh; overflow-y: auto; padding-bottom: 220px; }

        .header { margin-bottom: 20px; padding-top: 10px; }
        .brand { font-size: 24px; font-weight: 800; text-transform: uppercase; letter-spacing: 1px; color: #FFF; }
        .subtitle { font-size: 12px; color: var(--text-secondary); margin-top: 4px; }

        /* --- СЕТКА (КОМПАКТНАЯ) --- */
        .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
        
        .card {
            background: var(--card-bg);
            border: 1px solid var(--card-border);
            border-radius: 18px; /* Чуть меньше радиус */
            padding: 16px;       /* Меньше отступы */
            position: relative;
            height: 115px;       /* УМЕНЬШИЛ ВЫСОТУ (было 140) */
            overflow: hidden;
            display: flex; flex-direction: column; justify-content: space-between;
        }
        .card.large { grid-column: span 2; height: 100px; flex-direction: row; align-items: center; }

        .card-text { position: relative; z-index: 2; max-width: 100%; }
        .card-title { font-size: 14px; font-weight: 700; line-height: 1.25; margin-bottom: 4px; text-transform: uppercase; }
        .card-sub { font-size: 10px; color: var(--text-secondary); font-weight: 500; }

        /* --- ИКОНКИ (FLAT) --- */
        .flat-icon {
            position: absolute;
            right: 8px; bottom: 8px; /* Прижал ближе к краю */
            width: 65px; height: 65px; /* Чуть уменьшил (было 80) */
            object-fit: contain;
            z-index: 1;
            pointer-events: none;
            transition: filter 0.3s ease;
        }
        
        /* --- ФИЛЬТРЫ ЦВЕТОВ (CSS MAGIC) --- */
        /* Исходник синий. Крутим Hue, чтобы получить другие цвета */
        
        /* 1. ЗОЛОТО (Под бренд) */
        .color-gold .flat-icon { filter: hue-rotate(155deg) saturate(1.5) brightness(1.1); }
        
        /* 2. БЕЛЫЙ (Монохром) */
        .color-white .flat-icon { filter: grayscale(1) brightness(1.5); }
        
        /* 3. НЕОН (Голубой, но ярче) */
        .color-neon .flat-icon { filter: brightness(1.3) drop-shadow(0 0 5px rgba(0,122,255,0.5)); }
        
        /* 4. МЯТА (Зеленый) */
        .color-mint .flat-icon { filter: hue-rotate(290deg) brightness(1.2); }
        
        /* 5. КОРАЛЛ (Оранжевый) */
        .color-coral .flat-icon { filter: hue-rotate(130deg) saturate(1.2); }


        /* --- ПАНЕЛЬ ВЫБОРА --- */
        .panel {
            position: fixed; bottom: 0; left: 0; width: 100%;
            background: #151517;
            border-top: 1px solid #2C2C2E;
            border-radius: 24px 24px 0 0;
            padding: 20px; z-index: 100;
            padding-bottom: calc(20px + env(safe-area-inset-bottom));
        }

        .panel-header { margin-bottom: 15px; text-align: center; }
        .panel-title { font-weight: 700; font-size: 13px; text-transform: uppercase; color: var(--text-secondary); }
        
        .colors-scroll {
            display: flex; gap: 10px; overflow-x: auto; padding-bottom: 5px;
            justify-content: center;
        }
        
        .color-btn {
            width: 50px; height: 50px; border-radius: 50%;
            border: 2px solid transparent;
            cursor: pointer; position: relative;
            background-color: #2C2C2E;
            display: flex; align-items: center; justify-content: center;
            font-size: 20px;
        }
        .color-btn.active { border-color: #FFF; transform: scale(1.1); }
        
        /* Индикаторы цвета кнопок */
        .btn-gold { background: linear-gradient(135deg, #FFD700, #B8860B); color: #000; }
        .btn-white { background: #E5E5EA; color: #000; }
        .btn-neon { background: #007AFF; color: #FFF; }
        .btn-mint { background: #00C853; color: #FFF; }
        .btn-coral { background: #FF6B6B; color: #FFF; }

    </style>
</head>
<body>

<div id="app">
    <div class="header">
        <div class="brand">КИНОЦЕХ</div>
        <div class="subtitle">Night Mode Fitting</div>
    </div>

    <!-- СЕТКА (Класс color-gold меняется JS) -->
    <div class="grid color-gold" id="main-grid">
        <!-- 1. ПРАВИЛА -->
        <div class="card large">
            <div class="card-text">
                <div class="card-title">Правила группы</div>
                <div class="card-sub">Обязательно к прочтению</div>
            </div>
            <img src="https://img.icons8.com/fluency/96/rules.png" class="flat-icon" alt="Rules">
        </div>

        <!-- 2. ОБЪЯВЛЕНИЕ -->
        <div class="card">
            <div class="card-text">
                <div class="card-title">Разместить<br>объявление</div>
            </div>
            <img src="https://img.icons8.com/fluency/96/create-new.png" class="flat-icon" alt="Post">
        </div>

        <!-- 3. РЕКЛАМА -->
        <div class="card">
            <div class="card-text">
                <div class="card-title">Разместить<br>рекламу</div>
            </div>
            <img src="https://img.icons8.com/fluency/96/megaphone.png" class="flat-icon" alt="Ads">
        </div>

        <!-- 4. БРИГАДИРЫ -->
        <div class="card" style="opacity: 0.7;">
            <div class="card-text">
                <div class="card-title">Проверенные<br>бригадиры</div>
                <div class="card-sub" style="margin-top:4px;">Скоро</div>
            </div>
            <img src="https://img.icons8.com/fluency/96/security-checked.png" class="flat-icon" alt="Brigadiers">
        </div>

        <!-- 5. СТАТЬИ -->
        <div class="card" style="opacity: 0.7;">
            <div class="card-text">
                <div class="card-title">Полезные<br>статьи</div>
                <div class="card-sub" style="margin-top:4px;">Скоро</div>
            </div>
            <img src="https://img.icons8.com/fluency/96/reading.png" class="flat-icon" alt="Articles">
        </div>
    </div>
</div>

<!-- ПАНЕЛЬ ВЫБОРА ЦВЕТА -->
<div class="panel">
    <div class="panel-header">
        <div class="panel-title">Цвет иконок (Ночь)</div>
    </div>
    
    <div class="colors-scroll">
        <!-- ЗОЛОТО -->
        <div class="color-btn btn-gold active" onclick="setColor('color-gold', this)">👑</div>
        
        <!-- БЕЛЫЙ -->
        <div class="color-btn btn-white" onclick="setColor('color-white', this)">⚪</div>
        
        <!-- НЕОН -->
        <div class="color-btn btn-neon" onclick="setColor('color-neon', this)">🔵</div>
        
        <!-- МЯТА -->
        <div class="color-btn btn-mint" onclick="setColor('color-mint', this)">🟢</div>
        
        <!-- КОРАЛЛ -->
        <div class="color-btn btn-coral" onclick="setColor('color-coral', this)">🔴</div>
    </div>
</div>

<script>
    function setColor(colorClass, btn) {
        // 1. Меняем класс сетки
        const grid = document.getElementById('main-grid');
        grid.className = `grid ${colorClass}`;
        
        // 2. Активная кнопка
        document.querySelectorAll('.color-btn').forEach(b => b.classList.remove('active'));
        btn.classList.add('active');
        
        // 3. Вибрация
        if(window.Telegram && Telegram.WebApp.HapticFeedback) {
            Telegram.WebApp.HapticFeedback.selectionChanged();
        }
    }

    // Инициализация
    if(window.Telegram) {
        Telegram.WebApp.ready();
        Telegram.WebApp.expand();
        Telegram.WebApp.setBackgroundColor('#0F0F11');
        Telegram.WebApp.setHeaderColor('#0F0F11');
    }
</script>

</body>
</html>
