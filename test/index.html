<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>KINOCEKH | Simple Fitting</title>
    
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@500;700;800&display=block" rel="stylesheet">
    
    <style>
        /* --- БАЗА --- */
        :root {
            --font-main: 'Montserrat', sans-serif;
            
            /* DARK THEME */
            --bg-color: #0F0F11;
            --text-primary: #FFFFFF;
            --text-secondary: #9aa0a6;
            
            /* КАРТОЧКИ (Без стекла, просто чистый цвет) */
            --card-bg: #1C1C1E;
            --card-border: #2C2C2E;
            --card-shadow: none; /* Убрали тени */
            
            --accent-color: #D4AF37;
        }

        [data-theme="light"] {
            --bg-color: #F2F2F7;
            --text-primary: #000000;
            --text-secondary: #6e6e73;
            
            --card-bg: #FFFFFF;
            --card-border: #E5E5EA;
            
            --accent-color: #007AFF;
        }

        body {
            margin: 0; padding: 0; background: var(--bg-color); color: var(--text-primary);
            font-family: var(--font-main); transition: background 0.2s ease;
            overflow: hidden; -webkit-font-smoothing: antialiased;
        }

        #app { padding: 16px; height: 100vh; overflow-y: auto; padding-bottom: 220px; }

        .header { margin-bottom: 24px; padding-top: 10px; display: flex; justify-content: space-between; align-items: center; }
        .brand { font-size: 24px; font-weight: 800; text-transform: uppercase; letter-spacing: 1px; }

        /* --- СЕТКА --- */
        .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
        
        .card {
            background: var(--card-bg);
            border: 1px solid var(--card-border);
            border-radius: 20px;
            padding: 18px;
            position: relative;
            height: 140px;
            overflow: hidden;
            /* Убрали анимации при появлении */
            display: flex; flex-direction: column; justify-content: space-between;
        }
        .card:active { opacity: 0.8; } /* Простое нажатие */
        .card.large { grid-column: span 2; height: 110px; flex-direction: row; align-items: center; }

        .card-text { position: relative; z-index: 2; max-width: 100%; }
        .card-title { font-size: 15px; font-weight: 700; line-height: 1.3; margin-bottom: 4px; text-transform: uppercase; }
        .card-sub { font-size: 11px; color: var(--text-secondary); font-weight: 500; }

        /* --- ИКОНКИ (СТАТИКА) --- */
        .static-icon {
            position: absolute;
            right: 10px; bottom: 10px;
            width: 80px; height: 80px;
            object-fit: contain;
            z-index: 1;
            /* Никаких анимаций и фильтров */
            pointer-events: none;
        }
        
        /* Специфика для Notion стиля (инверсия в темной теме) */
        .notion-mode .static-icon { filter: invert(1); opacity: 0.8; }
        [data-theme="light"] .notion-mode .static-icon { filter: none; opacity: 1; }

        /* --- ПАНЕЛЬ ВЫБОРА --- */
        .panel {
            position: fixed; bottom: 0; left: 0; width: 100%;
            background: var(--card-bg);
            border-top: 1px solid var(--card-border);
            border-radius: 24px 24px 0 0;
            padding: 20px; z-index: 100;
            padding-bottom: calc(20px + env(safe-area-inset-bottom));
        }

        .panel-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 15px; }
        .panel-title { font-weight: 700; font-size: 14px; text-transform: uppercase; color: var(--text-secondary); }
        
        .theme-btn {
            background: var(--bg-color); border: 1px solid var(--card-border);
            padding: 6px 12px; border-radius: 20px; font-size: 12px; font-weight: 600;
            color: var(--text-primary); cursor: pointer;
        }

        .concept-grid { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 10px; }
        
        .concept-btn {
            background: var(--bg-color); border: 1px solid transparent;
            border-radius: 12px; padding: 12px 5px;
            display: flex; flex-direction: column; align-items: center; gap: 8px;
            cursor: pointer;
        }
        .concept-btn.active { 
            border-color: var(--accent-color); 
            background: rgba(128,128,128,0.1);
        }
        
        .c-emoji { font-size: 20px; }
        .c-name { font-size: 10px; font-weight: 700; text-transform: uppercase; }

    </style>
</head>
<body data-theme="dark">

<div id="app">
    <div class="header">
        <div class="brand">КИНОЦЕХ</div>
    </div>

    <div class="grid" id="main-grid">
        <!-- 1. ПРАВИЛА -->
        <div class="card large">
            <div class="card-text">
                <div class="card-title">Правила группы</div>
                <div class="card-sub">Обязательно к прочтению</div>
            </div>
            <img id="img-rules" src="" class="static-icon" alt="Rules">
        </div>

        <!-- 2. ОБЪЯВЛЕНИЕ -->
        <div class="card">
            <div class="card-text">
                <div class="card-title">Разместить<br>объявление</div>
            </div>
            <img id="img-post" src="" class="static-icon" alt="Post">
        </div>

        <!-- 3. РЕКЛАМА -->
        <div class="card">
            <div class="card-text">
                <div class="card-title">Разместить<br>рекламу</div>
            </div>
            <img id="img-ads" src="" class="static-icon" alt="Ads">
        </div>

        <!-- 4. БРИГАДИРЫ -->
        <div class="card" style="opacity: 0.7;">
            <div class="card-text">
                <div class="card-title">Проверенные<br>бригадиры</div>
                <div class="card-sub" style="margin-top:4px;">Скоро</div>
            </div>
            <img id="img-brig" src="" class="static-icon" alt="Brigadiers">
        </div>

        <!-- 5. СТАТЬИ -->
        <div class="card" style="opacity: 0.7;">
            <div class="card-text">
                <div class="card-title">Полезные<br>статьи</div>
                <div class="card-sub" style="margin-top:4px;">Скоро</div>
            </div>
            <img id="img-art" src="" class="static-icon" alt="Articles">
        </div>
    </div>
</div>

<!-- ПАНЕЛЬ ВЫБОРА -->
<div class="panel">
    <div class="panel-header">
        <div class="panel-title">Выберите стиль</div>
        <button class="theme-btn" onclick="toggleTheme()">День / Ночь</button>
    </div>
    
    <div class="concept-grid">
        <!-- ВАРИАНТ 1: APPLE (Классика) -->
        <div class="concept-btn active" onclick="setConcept('apple', this)">
            <span class="c-emoji">🍎</span>
            <span class="c-name">Apple (Static)</span>
        </div>
        
        <!-- ВАРИАНТ 2: NOTION (Скетч) -->
        <div class="concept-btn" onclick="setConcept('notion', this)">
            <span class="c-emoji">✏️</span>
            <span class="c-name">Notion (Sketch)</span>
        </div>
        
        <!-- ВАРИАНТ 3: FLAT (Вектор) -->
        <div class="concept-btn" onclick="setConcept('flat', this)">
            <span class="c-emoji">🎨</span>
            <span class="c-name">Flat (Simple)</span>
        </div>
    </div>
</div>

<script>
    // --- БАЗА КАРТИНОК (Статика) ---
    const assets = {
        // 1. APPLE STYLE (Чистые, понятные, без анимации)
        apple: {
            rules: "https://em-content.zobj.net/source/apple/391/scroll_1f4dc.png",
            post: "https://em-content.zobj.net/source/apple/391/memo_1f4dd.png",
            ads: "https://em-content.zobj.net/source/apple/391/megaphone_1f4e3.png",
            brig: "https://em-content.zobj.net/source/apple/391/shield_1f6e1-fe0f.png",
            art: "https://em-content.zobj.net/source/apple/391/books_1f4da.png"
        },
        
        // 2. NOTION STYLE (Черно-белые скетчи)
        notion: {
            rules: "https://img.icons8.com/ios/100/rules.png",
            post: "https://img.icons8.com/ios/100/create-new.png",
            ads: "https://img.icons8.com/ios/100/megaphone.png",
            brig: "https://img.icons8.com/ios/100/security-checked.png",
            art: "https://img.icons8.com/ios/100/reading.png"
        },
        
        // 3. FLAT STYLE (Плоский цвет)
        flat: {
            rules: "https://img.icons8.com/fluency/96/rules.png",
            post: "https://img.icons8.com/fluency/96/create-new.png",
            ads: "https://img.icons8.com/fluency/96/megaphone.png",
            brig: "https://img.icons8.com/fluency/96/security-checked.png",
            art: "https://img.icons8.com/fluency/96/reading.png"
        }
    };

    function setConcept(conceptName, btnElement) {
        // 1. Кнопки
        document.querySelectorAll('.concept-btn').forEach(b => b.classList.remove('active'));
        btnElement.classList.add('active');

        // 2. Режим Notion (для инверсии цвета)
        const grid = document.getElementById('main-grid');
        if (conceptName === 'notion') {
            grid.classList.add('notion-mode');
        } else {
            grid.classList.remove('notion-mode');
        }

        // 3. Обновляем картинки
        const set = assets[conceptName];
        document.getElementById('img-rules').src = set.rules;
        document.getElementById('img-post').src = set.post;
        document.getElementById('img-ads').src = set.ads;
        document.getElementById('img-brig').src = set.brig;
        document.getElementById('img-art').src = set.art;
        
        if(window.Telegram && Telegram.WebApp.HapticFeedback) {
            Telegram.WebApp.HapticFeedback.selectionChanged();
        }
    }

    function toggleTheme() {
        const body = document.body;
        const isDark = body.getAttribute('data-theme') === 'dark';
        body.setAttribute('data-theme', isDark ? 'light' : 'dark');
        if(window.Telegram && Telegram.WebApp.HapticFeedback) {
            Telegram.WebApp.HapticFeedback.impactOccurred('medium');
        }
    }

    // Старт
    window.onload = () => {
        const firstBtn = document.querySelector('.concept-btn.active');
        setConcept('apple', firstBtn);
        
        if(window.Telegram) {
            Telegram.WebApp.ready();
            Telegram.WebApp.expand();
        }
    };
</script>

</body>
</html>
