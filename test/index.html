<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>KINOCEKH | Day Blue Fitting</title>
    
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@500;700;800&display=block" rel="stylesheet">
    
    <style>
        /* --- БАЗА --- */
        :root {
            --font-main: 'Montserrat', sans-serif;
            
            /* ПЕРЕМЕННЫЕ (Будут меняться JS) */
            --bg-color: #F2F2F7; /* Start with Light */
            --text-primary: #000000;
            --text-secondary: #6e6e73;
            --card-bg: #FFFFFF;
            --card-border: #E5E5EA;
            
            /* ФИЛЬТР ИКОНОК (По умолчанию - Navy/Original) */
            --icon-filter: brightness(0.7) saturate(1.2) hue-rotate(-5deg); 
        }

        /* DARK THEME OVERRIDE (Фиксированный Slate, как ты утвердил) */
        [data-theme="dark"] {
            --bg-color: #0F0F11;
            --text-primary: #FFFFFF;
            --text-secondary: #9aa0a6;
            --card-bg: #1C1C1E;
            --card-border: #2C2C2E;
            /* Утвержденный ночной фильтр (Slate) */
            --icon-filter: hue-rotate(20deg) saturate(0.2) brightness(0.7) !important;
        }

        body {
            margin: 0; padding: 0; background: var(--bg-color); color: var(--text-primary);
            font-family: var(--font-main); transition: background 0.3s ease, color 0.3s ease;
            overflow: hidden; -webkit-font-smoothing: antialiased;
        }

        #app { padding: 16px; height: 100vh; overflow-y: auto; padding-bottom: 240px; }

        .header { margin-bottom: 20px; padding-top: 10px; display: flex; justify-content: space-between; align-items: center; }
        .brand { font-size: 24px; font-weight: 800; text-transform: uppercase; letter-spacing: 1px; }

        /* --- СЕТКА --- */
        .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
        
        .card {
            background: var(--card-bg);
            border: 1px solid var(--card-border);
            border-radius: 18px;
            padding: 16px;
            position: relative;
            height: 115px;
            overflow: hidden;
            display: flex; flex-direction: column; justify-content: space-between;
            transition: background 0.3s, border-color 0.3s;
        }
        .card.large { grid-column: span 2; height: 100px; flex-direction: row; align-items: center; }

        .card-text { position: relative; z-index: 2; max-width: 100%; }
        .card-title { font-size: 14px; font-weight: 700; line-height: 1.25; margin-bottom: 4px; text-transform: uppercase; }
        .card-sub { font-size: 10px; color: var(--text-secondary); font-weight: 500; }

        /* --- ИКОНКИ --- */
        .flat-icon {
            position: absolute;
            right: 8px; bottom: 8px;
            width: 65px; height: 65px;
            object-fit: contain;
            z-index: 1;
            pointer-events: none;
            
            /* ГЛАВНАЯ МАГИЯ ЗДЕСЬ */
            filter: var(--icon-filter);
            transition: filter 0.3s ease;
        }

        /* --- ВАРИАНТЫ ДЛЯ ДНЯ (CSS Classes) --- */
        /* 1. NAVY (Original) - Темный, глубокий */
        .day-navy { --icon-filter: brightness(0.6) saturate(1.1) hue-rotate(-5deg); }
        
        /* 2. STEEL (Сталь) - Спокойный, сероватый */
        .day-steel { --icon-filter: grayscale(0.4) brightness(0.9); }
        
        /* 3. ROYAL (Королевский) - Сбалансированный */
        .day-royal { --icon-filter: brightness(0.9) saturate(0.9); }
        
        /* 4. OCEAN (Океан) - Глубокий Teal */
        .day-ocean { --icon-filter: hue-rotate(-25deg) brightness(0.8) saturate(1.1); }
        
        /* 5. INDIGO (Индиго) - Модный фиолетово-синий */
        .day-indigo { --icon-filter: hue-rotate(15deg) brightness(0.8); }


        /* --- ПАНЕЛЬ --- */
        .panel {
            position: fixed; bottom: 0; left: 0; width: 100%;
            background: var(--card-bg);
            border-top: 1px solid var(--card-border);
            border-radius: 24px 24px 0 0;
            padding: 20px; z-index: 100;
            padding-bottom: calc(20px + env(safe-area-inset-bottom));
        }
        
        .panel-header { text-align: center; margin-bottom: 15px; }
        .panel-title { font-size: 12px; font-weight: 700; text-transform: uppercase; color: var(--text-secondary); }

        .colors-scroll {
            display: flex; gap: 12px; justify-content: center; margin-bottom: 20px;
        }
        
        .color-btn {
            width: 44px; height: 44px; border-radius: 50%;
            border: 2px solid var(--card-border);
            cursor: pointer; position: relative;
            display: flex; align-items: center; justify-content: center;
            transition: transform 0.2s;
        }
        .color-btn.active { border-color: #000; transform: scale(1.15); }
        [data-theme="dark"] .color-btn.active { border-color: #FFF; }

        /* Визуализация кнопок */
        .bg-navy { background: #003366; }
        .bg-steel { background: #607D8B; }
        .bg-royal { background: #2962FF; }
        .bg-ocean { background: #006064; }
        .bg-indigo { background: #3F51B5; }

        .toggle-btn {
            width: 100%;
            background: var(--bg-color);
            border: 1px solid var(--card-border);
            color: var(--text-primary);
            padding: 12px;
            border-radius: 12px;
            font-weight: 700;
            font-size: 13px;
            cursor: pointer;
            text-transform: uppercase;
        }

    </style>
</head>
<body class="day-navy" data-theme="light">

<div id="app">
    <div class="header">
        <div class="brand">КИНОЦЕХ</div>
    </div>

    <div class="grid">
        <!-- 1. ПРАВИЛА -->
        <div class="card large">
            <div class="card-text">
                <div class="card-title">Правила группы</div>
                <div class="card-sub">Обязательно к прочтению</div>
            </div>
            <img src="https://img.icons8.com/fluency/96/rules.png" class="flat-icon" alt="Rules">
        </div>

        <!-- 2. ОБЪЯВЛЕНИЕ -->
        <div class="card">
            <div class="card-text">
                <div class="card-title">Разместить<br>объявление</div>
            </div>
            <img src="https://img.icons8.com/fluency/96/create-new.png" class="flat-icon" alt="Post">
        </div>

        <!-- 3. РЕКЛАМА -->
        <div class="card">
            <div class="card-text">
                <div class="card-title">Разместить<br>рекламу</div>
            </div>
            <img src="https://img.icons8.com/fluency/96/megaphone.png" class="flat-icon" alt="Ads">
        </div>

        <!-- 4. БРИГАДИРЫ -->
        <div class="card" style="opacity: 0.7;">
            <div class="card-text">
                <div class="card-title">Проверенные<br>бригадиры</div>
                <div class="card-sub" style="margin-top:4px;">Скоро</div>
            </div>
            <img src="https://img.icons8.com/fluency/96/security-checked.png" class="flat-icon" alt="Brigadiers">
        </div>

        <!-- 5. СТАТЬИ -->
        <div class="card" style="opacity: 0.7;">
            <div class="card-text">
                <div class="card-title">Полезные<br>статьи</div>
                <div class="card-sub" style="margin-top:4px;">Скоро</div>
            </div>
            <img src="https://img.icons8.com/fluency/96/reading.png" class="flat-icon" alt="Articles">
        </div>
    </div>
</div>

<!-- ПАНЕЛЬ -->
<div class="panel">
    <div class="panel-title">Выберите синий (для Дня)</div>
    
    <div class="colors-scroll">
        <!-- 1. NAVY -->
        <div class="color-btn bg-navy active" onclick="setDayColor('day-navy', this)"></div>
        <!-- 2. STEEL -->
        <div class="color-btn bg-steel" onclick="setDayColor('day-steel', this)"></div>
        <!-- 3. ROYAL -->
        <div class="color-btn bg-royal" onclick="setDayColor('day-royal', this)"></div>
        <!-- 4. OCEAN -->
        <div class="color-btn bg-ocean" onclick="setDayColor('day-ocean', this)"></div>
        <!-- 5. INDIGO -->
        <div class="color-btn bg-indigo" onclick="setDayColor('day-indigo', this)"></div>
    </div>

    <button class="toggle-btn" onclick="toggleTheme()">Проверить Ночь (Slate)</button>
</div>

<script>
    function setDayColor(className, btn) {
        // Меняем класс body (влияет только на светлую тему)
        document.body.className = className;
        
        // Кнопки
        document.querySelectorAll('.color-btn').forEach(b => b.classList.remove('active'));
        btn.classList.add('active');
        
        // Если мы в ночи, переключаем на день, чтобы увидеть результат
        if (document.body.getAttribute('data-theme') === 'dark') {
            toggleTheme();
        }
        
        if(window.Telegram && Telegram.WebApp.HapticFeedback) {
            Telegram.WebApp.HapticFeedback.selectionChanged();
        }
    }

    function toggleTheme() {
        const body = document.body;
        const isDark = body.getAttribute('data-theme') === 'dark';
        const newTheme = isDark ? 'light' : 'dark';
        
        body.setAttribute('data-theme', newTheme);
        
        if(window.Telegram && Telegram.WebApp.HapticFeedback) {
            Telegram.WebApp.HapticFeedback.impactOccurred('medium');
            
            if (newTheme === 'light') {
                Telegram.WebApp.setHeaderColor('#F2F2F7');
                Telegram.WebApp.setBackgroundColor('#F2F2F7');
            } else {
                Telegram.WebApp.setHeaderColor('#0F0F11');
                Telegram.WebApp.setBackgroundColor('#0F0F11');
            }
        }
    }

    // Инициализация
    if(window.Telegram) {
        Telegram.WebApp.ready();
        Telegram.WebApp.expand();
        Telegram.WebApp.setHeaderColor('#F2F2F7');
        Telegram.WebApp.setBackgroundColor('#F2F2F7');
    }
</script>

</body>
</html>
