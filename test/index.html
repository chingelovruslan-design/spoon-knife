<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>KINOCEKH | Visual Concept Fitting</title>
    
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@500;700;800&display=block" rel="stylesheet">
    
    <style>
        /* --- БАЗА (GLASS STYLE) --- */
        :root {
            --font-main: 'Montserrat', sans-serif;
            
            /* DARK THEME */
            --bg-color: #0F0F11;
            --text-primary: #FFFFFF;
            --text-secondary: #9aa0a6;
            
            /* СТЕКЛО */
            --card-bg: rgba(255, 255, 255, 0.03);
            --card-border: rgba(255, 255, 255, 0.1);
            --card-blur: 12px;
            --card-shadow: 0 10px 30px -10px rgba(0,0,0,0.5);
            
            --accent-color: #D4AF37;
            --accent-glow: rgba(212, 175, 55, 0.4);
        }

        [data-theme="light"] {
            --bg-color: #F2F2F7;
            --text-primary: #000000;
            --text-secondary: #6e6e73;
            
            /* СТЕКЛО LIGHT */
            --card-bg: rgba(255, 255, 255, 0.65);
            --card-border: rgba(255, 255, 255, 0.4);
            --card-shadow: 0 10px 30px -10px rgba(0, 51, 102, 0.1);
            
            --accent-color: #007AFF;
            --accent-glow: rgba(0, 122, 255, 0.3);
        }

        body {
            margin: 0; padding: 0; background: var(--bg-color); color: var(--text-primary);
            font-family: var(--font-main); transition: background 0.4s ease;
            overflow: hidden; -webkit-font-smoothing: antialiased;
        }

        /* ФОНОВЫЙ СВЕТ */
        body::before {
            content: ''; position: absolute; top: -10%; left: 0; right: 0; height: 60vh;
            background: radial-gradient(circle at 50% 0%, var(--accent-glow) 0%, transparent 60%);
            opacity: 0.4; pointer-events: none; z-index: 0;
            transition: background 0.5s ease;
        }

        #app { padding: 16px; height: 100vh; overflow-y: auto; padding-bottom: 220px; position: relative; z-index: 1; }

        .header { margin-bottom: 24px; padding-top: 10px; display: flex; justify-content: space-between; align-items: center; }
        .brand { font-size: 24px; font-weight: 800; text-transform: uppercase; letter-spacing: 1px; }

        /* --- СЕТКА --- */
        .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
        
        .card {
            background: var(--card-bg);
            border: 1px solid var(--card-border);
            backdrop-filter: blur(var(--card-blur)); -webkit-backdrop-filter: blur(var(--card-blur));
            border-radius: 24px;
            padding: 18px;
            position: relative;
            height: 150px;
            overflow: hidden;
            box-shadow: var(--card-shadow);
            transition: transform 0.2s, border-color 0.3s;
            display: flex; flex-direction: column; justify-content: space-between;
        }
        .card:active { transform: scale(0.97); border-color: var(--accent-color); }
        .card.large { grid-column: span 2; height: 120px; flex-direction: row; align-items: center; }

        .card-text { position: relative; z-index: 2; max-width: 100%; }
        .card-title { font-size: 15px; font-weight: 700; line-height: 1.3; margin-bottom: 4px; text-transform: uppercase; }
        .card-sub { font-size: 11px; color: var(--text-secondary); font-weight: 500; }

        /* --- 3D ИКОНКИ --- */
        .img-3d {
            position: absolute;
            right: 0; bottom: 0;
            width: 90px; height: 90px;
            object-fit: contain;
            z-index: 1;
            transition: all 0.4s cubic-bezier(0.34, 1.56, 0.64, 1);
            filter: drop-shadow(0 10px 20px rgba(0,0,0,0.2));
            pointer-events: none;
            
            /* Анимация появления */
            opacity: 0; transform: translateY(20px) scale(0.8);
        }
        
        /* Класс для показа картинки */
        .img-3d.visible { opacity: 1; transform: translateY(0) scale(1); }

        /* Анимация парения */
        @keyframes float { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-6px); } }
        .img-3d.visible { animation: float 5s ease-in-out infinite; }

        /* Специфика для большой карточки */
        .card.large .img-3d { right: 10px; bottom: 10px; width: 100px; height: 100px; }

        /* --- ПАНЕЛЬ ВЫБОРА --- */
        .panel {
            position: fixed; bottom: 0; left: 0; width: 100%;
            background: rgba(20, 20, 22, 0.95);
            backdrop-filter: blur(20px);
            border-radius: 24px 24px 0 0;
            padding: 20px; z-index: 100;
            border-top: 1px solid rgba(255,255,255,0.1);
            padding-bottom: calc(20px + env(safe-area-inset-bottom));
        }
        [data-theme="light"] .panel { background: rgba(255, 255, 255, 0.95); border-top: 1px solid rgba(0,0,0,0.1); }

        .panel-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 15px; }
        .panel-title { font-weight: 700; font-size: 14px; text-transform: uppercase; color: var(--text-secondary); }
        
        .theme-btn {
            background: var(--card-bg); border: 1px solid var(--card-border);
            padding: 6px 12px; border-radius: 20px; font-size: 12px; font-weight: 600;
            color: var(--text-primary); cursor: pointer;
        }

        .concept-grid { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 10px; }
        
        .concept-btn {
            background: var(--card-bg); border: 1px solid transparent;
            border-radius: 16px; padding: 12px 5px;
            display: flex; flex-direction: column; align-items: center; gap: 8px;
            cursor: pointer; transition: all 0.2s;
        }
        .concept-btn.active { 
            background: var(--accent-glow); 
            border-color: var(--accent-color); 
            color: #FFF;
        }
        [data-theme="light"] .concept-btn.active { color: #000; }
        
        .c-emoji { font-size: 24px; }
        .c-name { font-size: 11px; font-weight: 700; text-transform: uppercase; }

    </style>
</head>
<body data-theme="dark">

<div id="app">
    <div class="header">
        <div class="brand">КИНОЦЕХ</div>
    </div>

    <div class="grid">
        <!-- 1. ПРАВИЛА -->
        <div class="card large">
            <div class="card-text">
                <div class="card-title">Правила группы</div>
                <div class="card-sub">Обязательно к прочтению</div>
            </div>
            <img id="img-rules" src="" class="img-3d" alt="Rules">
        </div>

        <!-- 2. ОБЪЯВЛЕНИЕ -->
        <div class="card">
            <div class="card-text">
                <div class="card-title">Разместить<br>объявление</div>
            </div>
            <img id="img-post" src="" class="img-3d" alt="Post">
        </div>

        <!-- 3. РЕКЛАМА -->
        <div class="card">
            <div class="card-text">
                <div class="card-title">Разместить<br>рекламу</div>
            </div>
            <img id="img-ads" src="" class="img-3d" alt="Ads">
        </div>

        <!-- 4. БРИГАДИРЫ -->
        <div class="card" style="opacity: 0.8;">
            <div class="card-text">
                <div class="card-title">Проверенные<br>бригадиры</div>
                <div class="card-sub" style="margin-top:4px;">Скоро</div>
            </div>
            <img id="img-brig" src="" class="img-3d" alt="Brigadiers">
        </div>

        <!-- 5. СТАТЬИ -->
        <div class="card" style="opacity: 0.8;">
            <div class="card-text">
                <div class="card-title">Полезные<br>статьи</div>
                <div class="card-sub" style="margin-top:4px;">Скоро</div>
            </div>
            <img id="img-art" src="" class="img-3d" alt="Articles">
        </div>
    </div>
</div>

<!-- ПАНЕЛЬ ВЫБОРА КОНЦЕПЦИИ -->
<div class="panel">
    <div class="panel-header">
        <div class="panel-title">Выберите концепцию</div>
        <button class="theme-btn" onclick="toggleTheme()">День / Ночь</button>
    </div>
    
    <div class="concept-grid">
        <!-- ВАРИАНТ 1: ЛЮДИ -->
        <div class="concept-btn active" onclick="setConcept('people', this)">
            <span class="c-emoji">🎬</span>
            <span class="c-name">Люди (Pro)</span>
        </div>
        
        <!-- ВАРИАНТ 2: РУКИ -->
        <div class="concept-btn" onclick="setConcept('hands', this)">
            <span class="c-emoji">🤌</span>
            <span class="c-name">Руки</span>
        </div>
        
        <!-- ВАРИАНТ 3: ПРЕДМЕТЫ -->
        <div class="concept-btn" onclick="setConcept('objects', this)">
            <span class="c-emoji">🧊</span>
            <span class="c-name">Предметы</span>
        </div>
    </div>
</div>

<script>
    // --- БАЗА КАРТИНОК (CDN JSDelivr - Стабильные ссылки) ---
    const assets = {
        // ВАРИАНТ 1: ЛЮДИ (ПРОФЕССИИ)
        people: {
            rules: "https://cdn.jsdelivr.net/gh/Tarikul-Islam-Anik/Animated-Fluent-Emojis/Emojis/People/Professions/Woman%20Teacher.png", 
            post: "https://cdn.jsdelivr.net/gh/Tarikul-Islam-Anik/Animated-Fluent-Emojis/Emojis/People/Person/Person%20Raising%20Hand.png", 
            ads: "https://cdn.jsdelivr.net/gh/Tarikul-Islam-Anik/Animated-Fluent-Emojis/Emojis/People/Person/Woman%20Genie.png", 
            brig: "https://cdn.jsdelivr.net/gh/Tarikul-Islam-Anik/Animated-Fluent-Emojis/Emojis/People/Professions/Construction%20Worker.png", 
            art: "https://cdn.jsdelivr.net/gh/Tarikul-Islam-Anik/Animated-Fluent-Emojis/Emojis/People/Professions/Woman%20Student.png"
        },
        
        // ВАРИАНТ 2: РУКИ (ЖЕСТЫ)
        hands: {
            rules: "https://cdn.jsdelivr.net/gh/Tarikul-Islam-Anik/Animated-Fluent-Emojis/Emojis/Hand%20gestures/Writing%20Hand.png",
            post: "https://cdn.jsdelivr.net/gh/Tarikul-Islam-Anik/Animated-Fluent-Emojis/Emojis/Hand%20gestures/Hand%20with%20Index%20Finger%20and%20Thumb%20Crossed.png",
            ads: "https://cdn.jsdelivr.net/gh/Tarikul-Islam-Anik/Animated-Fluent-Emojis/Emojis/Hand%20gestures/Clapping%20Hands.png",
            brig: "https://cdn.jsdelivr.net/gh/Tarikul-Islam-Anik/Animated-Fluent-Emojis/Emojis/Hand%20gestures/Handshake.png",
            art: "https://cdn.jsdelivr.net/gh/Tarikul-Islam-Anik/Animated-Fluent-Emojis/Emojis/Hand%20gestures/Ok%20Hand.png"
        },
        
        // ВАРИАНТ 3: ПРЕДМЕТЫ (КЛАССИКА)
        objects: {
            rules: "https://cdn.jsdelivr.net/gh/Tarikul-Islam-Anik/Animated-Fluent-Emojis/Emojis/Objects/Scroll.png",
            post: "https://cdn.jsdelivr.net/gh/Tarikul-Islam-Anik/Animated-Fluent-Emojis/Emojis/Objects/Memo.png",
            ads: "https://cdn.jsdelivr.net/gh/Tarikul-Islam-Anik/Animated-Fluent-Emojis/Emojis/Objects/Megaphone.png",
            brig: "https://cdn.jsdelivr.net/gh/Tarikul-Islam-Anik/Animated-Fluent-Emojis/Emojis/Objects/Shield.png",
            art: "https://cdn.jsdelivr.net/gh/Tarikul-Islam-Anik/Animated-Fluent-Emojis/Emojis/Objects/Books.png"
        }
    };

    // --- ЛОГИКА СМЕНЫ ---
    function setConcept(conceptName, btnElement) {
        // 1. Анимация кнопок
        document.querySelectorAll('.concept-btn').forEach(b => b.classList.remove('active'));
        btnElement.classList.add('active');

        // 2. Получаем набор
        const set = assets[conceptName];
        
        // 3. Обновляем картинки
        updateImage('img-rules', set.rules);
        updateImage('img-post', set.post);
        updateImage('img-ads', set.ads);
        updateImage('img-brig', set.brig);
        updateImage('img-art', set.art);
        
        // Вибрация
        if(window.Telegram && Telegram.WebApp.HapticFeedback) {
            Telegram.WebApp.HapticFeedback.selectionChanged();
        }
    }

    function updateImage(id, src) {
        const img = document.getElementById(id);
        // Скрываем
        img.classList.remove('visible');
        
        setTimeout(() => {
            img.src = src;
            // Ждем загрузки
            img.onload = () => {
                img.classList.add('visible');
            };
            // Страховка
            setTimeout(() => img.classList.add('visible'), 100);
        }, 150);
    }

    function toggleTheme() {
        const body = document.body;
        const isDark = body.getAttribute('data-theme') === 'dark';
        body.setAttribute('data-theme', isDark ? 'light' : 'dark');
        if(window.Telegram && Telegram.WebApp.HapticFeedback) {
            Telegram.WebApp.HapticFeedback.impactOccurred('medium');
        }
    }

    // Инициализация
    window.onload = () => {
        const firstBtn = document.querySelector('.concept-btn.active');
        setConcept('people', firstBtn);
        
        if(window.Telegram) {
            Telegram.WebApp.ready();
            Telegram.WebApp.expand();
        }
    };
</script>

</body>
</html>
