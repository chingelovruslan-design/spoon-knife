<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>КИНОЦЕХ | Fitting Room</title>
    
    <!-- TELEGRAM API -->
    <script src="https://telegram.org/js/telegram-web-app.js"></script>

    <!-- FONTS -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700;800&display=block" rel="stylesheet">
    
    <style>
        /* --- ОСНОВНЫЕ ПЕРЕМЕННЫЕ (ИЗ ВАШЕГО КОДА) --- */
        :root {
            --font-display: 'Montserrat', sans-serif; 
            --font-body: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            --ease-spring: cubic-bezier(0.175, 0.885, 0.32, 1.1); 
            --ease-smooth: cubic-bezier(0.2, 0.8, 0.2, 1); 
            --duration-base: 0.3s;
            --bg-color: #0F0F11;
            --card-bg: rgba(255, 255, 255, 0.04);
            --card-active-bg: rgba(255, 255, 255, 0.08);
            --border-color: rgba(255, 255, 255, 0.08);
            --text-primary: #F2F2F2;
            --text-secondary: #9CA3AF;
            --accent-color: #D4AF37; 
            --nav-bg: rgba(15, 15, 17, 0.75); 
            --warn-bg: rgba(245, 158, 11, 0.08);
            --warn-text: #F59E0B;
            --danger-bg: rgba(220, 38, 38, 0.08);
            --danger-text: #EF4444;
            --glass-highlight: inset 0 1px 0 0 rgba(255, 255, 255, 0.15), inset 0 0 0 1px rgba(255,255,255,0.03);
        }

        [data-theme="light"] {
            --bg-color: #F2F2F7;
            --card-bg: #FFFFFF;
            --card-active-bg: #FFFFFF;
            --border-color: rgba(0, 51, 102, 0.15);
            --text-primary: #1C1C1E;
            --text-secondary: #636366;
            --accent-color: #003366; 
            --nav-bg: rgba(255, 255, 255, 0.75);
            --warn-bg: rgba(255, 149, 0, 0.1);
            --warn-text: #D47600;
            --danger-bg: rgba(255, 59, 48, 0.1);
            --danger-text: #D70015;
            --glass-highlight: inset 0 1px 0 0 rgba(255, 255, 255, 1), inset 0 0 0 1px rgba(0,0,0,0.02);
        }

        * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
        html, body { height: 100dvh; overflow: hidden; background-color: var(--bg-color); margin: 0; font-family: var(--font-body); color: var(--text-primary); transition: background-color 0.3s ease, color 0.3s ease; }

        /* --- БАЗОВЫЕ СТИЛИ (Сохранены для контекста) --- */
        .page { position: absolute; top: 0; left: 0; width: 100%; height: 100%; overflow-y: auto; padding-bottom: 100px; background: var(--bg-color); transition: transform 0.4s cubic-bezier(0.2, 0.8, 0.2, 1); z-index: 10; }
        .page.sub-page { transform: translateX(100%); z-index: 20; }
        .page.sub-page.active { transform: translateX(0); }
        .nav-bar { position: sticky; top: 0; background: var(--nav-bg); backdrop-filter: blur(20px); padding: 12px 16px; border-bottom: 1px solid var(--border-color); z-index: 50; display: flex; align-items: center; }
        .btn-back { background: none; border: none; color: var(--text-primary); font-family: var(--font-display); font-weight: 600; font-size: 15px; display: flex; align-items: center; cursor: pointer; }
        .btn-back svg { width: 20px; height: 20px; margin-right: 6px; }
        .page-intro { padding: 24px 20px; border-bottom: 1px solid var(--border-color); }
        .page-intro p { margin: 0; font-size: 14px; color: var(--text-secondary); }
        .page-intro strong { color: var(--text-primary); font-size: 15px; display: block; margin-bottom: 5px; }

        /* --- ПАНЕЛЬ ПРИМЕРОЧНОЙ (FITTING ROOM UI) --- */
        #fitting-panel {
            position: fixed; top: 80px; right: 10px; width: 140px;
            background: rgba(0,0,0,0.8); backdrop-filter: blur(10px);
            border: 1px solid rgba(255,255,255,0.1); border-radius: 12px;
            padding: 10px; z-index: 9999;
            display: none; /* Показываем только на странице рекламы */
            flex-direction: column; gap: 8px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
        }
        [data-theme="light"] #fitting-panel { background: rgba(255,255,255,0.9); border-color: rgba(0,0,0,0.1); }
        
        .fp-title { font-size: 10px; font-weight: 800; text-transform: uppercase; color: var(--accent-color); margin-bottom: 4px; letter-spacing: 1px; text-align: center; }
        .fp-btn {
            background: transparent; border: 1px solid var(--border-color); color: var(--text-secondary);
            padding: 6px; font-size: 10px; border-radius: 6px; cursor: pointer; text-align: left;
            transition: all 0.2s; font-family: var(--font-display);
        }
        .fp-btn:hover, .fp-btn.active { background: var(--accent-color); color: #fff; border-color: var(--accent-color); }
        .fp-toggle { margin-top: 8px; padding: 8px; background: var(--card-bg); text-align: center; border-radius: 6px; font-size: 11px; cursor: pointer; border: 1px solid var(--border-color); }

        /* --- КОНТЕЙНЕР КОНТЕНТА --- */
        .ad-content-wrapper { padding: 20px; opacity: 0; animation: fadeIn 0.5s forwards; }
        @keyframes fadeIn { to { opacity: 1; } }

        /* =========================================
           10 ВАРИАНТОВ ДИЗАЙНА (STYLES)
           ========================================= */

        /* STYLE 1: CLEAN MINIMAL (Базовый, чистый текст) */
        .style-1 .ad-text { font-size: 14px; line-height: 1.6; color: var(--text-secondary); margin-bottom: 16px; }
        .style-1 .ad-important { border-left: 2px solid var(--danger-text); padding-left: 16px; margin: 24px 0; }
        .style-1 .ad-important-title { color: var(--danger-text); font-weight: 700; text-transform: uppercase; font-size: 12px; display: block; margin-bottom: 8px; }
        .style-1 .ad-list-title { font-family: var(--font-display); font-weight: 700; margin-top: 30px; margin-bottom: 16px; color: var(--text-primary); }
        .style-1 .ad-item { margin-bottom: 20px; }
        .style-1 .ad-item-head { font-weight: 600; color: var(--text-primary); font-size: 14px; margin-bottom: 4px; }
        .style-1 .ad-item-desc { font-size: 13px; color: var(--text-secondary); line-height: 1.5; }

        /* STYLE 2: CARDS (Карточки) */
        .style-2 .ad-text { font-size: 14px; color: var(--text-secondary); margin-bottom: 16px; }
        .style-2 .ad-important { background: var(--warn-bg); padding: 16px; border-radius: 12px; border: 1px solid var(--warn-bg); margin: 20px 0; }
        .style-2 .ad-important-title { color: var(--warn-text); font-weight: 700; font-size: 12px; text-transform: uppercase; margin-bottom: 8px; display: block; }
        .style-2 .ad-list-title { font-family: var(--font-display); font-size: 15px; font-weight: 800; margin: 30px 0 15px; text-transform: uppercase; letter-spacing: 0.5px; }
        .style-2 .ad-grid { display: grid; grid-template-columns: 1fr; gap: 10px; }
        .style-2 .ad-item { background: var(--card-bg); padding: 16px; border-radius: 14px; border: 1px solid var(--border-color); }
        .style-2 .ad-item-head { color: var(--accent-color); font-weight: 700; font-size: 13px; margin-bottom: 6px; text-transform: uppercase; }
        .style-2 .ad-item-desc { font-size: 12px; color: var(--text-secondary); line-height: 1.4; }

        /* STYLE 3: ACCENT LINE (Акцентная линия слева) */
        .style-3 .ad-text { font-size: 14px; line-height: 1.7; color: var(--text-secondary); }
        .style-3 .ad-important { margin: 24px 0; padding: 20px; background: var(--card-bg); border-radius: 0 12px 12px 0; border-left: 4px solid var(--accent-color); }
        .style-3 .ad-important-title { color: var(--text-primary); font-weight: 700; text-transform: uppercase; font-size: 11px; letter-spacing: 1px; margin-bottom: 10px; display: block; }
        .style-3 .ad-list-title { font-weight: 700; font-size: 16px; margin-top: 30px; margin-bottom: 20px; color: var(--text-primary); }
        .style-3 .ad-item { position: relative; padding-left: 20px; margin-bottom: 24px; }
        .style-3 .ad-item::before { content: ''; position: absolute; left: 0; top: 4px; bottom: 4px; width: 2px; background: var(--border-color); }
        .style-3 .ad-item-head { font-family: var(--font-display); font-weight: 700; font-size: 14px; color: var(--text-primary); margin-bottom: 4px; }
        .style-3 .ad-item-desc { font-size: 13px; color: var(--text-secondary); }

        /* STYLE 4: NUMBERED CIRCLES (Нумерация в кругах) */
        .style-4 .ad-text { font-size: 13px; line-height: 1.6; color: var(--text-secondary); text-align: justify; }
        .style-4 .ad-important { border: 1px dashed var(--border-color); padding: 16px; border-radius: 12px; margin: 20px 0; }
        .style-4 .ad-important-title { color: var(--text-primary); font-weight: 800; font-size: 12px; margin-bottom: 8px; display: block; }
        .style-4 .ad-list-title { text-align: center; font-family: var(--font-display); font-weight: 700; margin: 30px 0 20px; text-transform: uppercase; letter-spacing: 1px; font-size: 12px; color: var(--text-secondary); }
        .style-4 .ad-item { display: flex; gap: 12px; margin-bottom: 20px; }
        .style-4 .ad-num { width: 24px; height: 24px; background: var(--accent-color); color: #fff; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 12px; font-weight: 700; flex-shrink: 0; margin-top: -2px; }
        .style-4 .ad-item-content { flex: 1; }
        .style-4 .ad-item-head { font-weight: 600; font-size: 14px; color: var(--text-primary); margin-bottom: 4px; }
        .style-4 .ad-item-desc { font-size: 13px; color: var(--text-secondary); }

        /* STYLE 5: GLASS PANELS (Стеклянные плашки) */
        .style-5 .ad-text { font-size: 14px; color: var(--text-secondary); margin-bottom: 12px; }
        .style-5 .ad-important { background: rgba(220, 38, 38, 0.1); border: 1px solid rgba(220, 38, 38, 0.2); padding: 16px; border-radius: 16px; margin: 24px 0; }
        .style-5 .ad-important-title { color: var(--danger-text); font-weight: 700; text-transform: uppercase; font-size: 11px; letter-spacing: 1px; margin-bottom: 8px; display: block; }
        .style-5 .ad-list-title { font-family: var(--font-display); font-size: 18px; font-weight: 800; margin: 30px 0 15px; color: var(--text-primary); }
        .style-5 .ad-item { background: var(--card-bg); box-shadow: var(--glass-highlight); padding: 18px; border-radius: 16px; margin-bottom: 10px; backdrop-filter: blur(10px); }
        .style-5 .ad-item-head { font-family: var(--font-display); font-weight: 700; font-size: 13px; color: var(--accent-color); text-transform: uppercase; margin-bottom: 6px; }
        .style-5 .ad-item-desc { font-size: 13px; color: var(--text-secondary); }

        /* STYLE 6: TYPOGRAPHIC (Акцент на типографику) */
        .style-6 .ad-text { font-size: 15px; line-height: 1.6; color: var(--text-primary); font-weight: 400; }
        .style-6 .ad-important { margin: 30px 0; padding-left: 0; }
        .style-6 .ad-important-title { font-family: var(--font-display); font-size: 24px; font-weight: 800; color: var(--accent-color); display: block; margin-bottom: 10px; line-height: 1; }
        .style-6 .ad-important-list li { margin-bottom: 8px; font-size: 14px; color: var(--text-secondary); }
        .style-6 .ad-list-title { font-size: 12px; font-weight: 600; text-transform: uppercase; color: var(--text-secondary); margin: 40px 0 20px; letter-spacing: 2px; border-bottom: 1px solid var(--border-color); padding-bottom: 10px; }
        .style-6 .ad-item { margin-bottom: 24px; }
        .style-6 .ad-item-head { font-size: 16px; font-weight: 700; color: var(--text-primary); margin-bottom: 6px; }
        .style-6 .ad-item-desc { font-size: 14px; color: var(--text-secondary); opacity: 0.8; }

        /* STYLE 7: GRID SYSTEM (Сетка 2x2) */
        .style-7 .ad-text { font-size: 13px; color: var(--text-secondary); margin-bottom: 16px; }
        .style-7 .ad-important { background: var(--card-bg); padding: 16px; border-radius: 8px; margin: 20px 0; border-left: 3px solid var(--text-primary); }
        .style-7 .ad-important-title { font-weight: 700; font-size: 12px; text-transform: uppercase; margin-bottom: 8px; display: block; }
        .style-7 .ad-list-title { font-family: var(--font-display); font-weight: 700; margin: 30px 0 16px; color: var(--text-primary); }
        .style-7 .ad-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
        .style-7 .ad-item { background: var(--card-bg); padding: 14px; border-radius: 12px; display: flex; flex-direction: column; }
        .style-7 .ad-item-head { font-size: 12px; font-weight: 700; color: var(--accent-color); margin-bottom: 6px; text-transform: uppercase; height: 30px; display: flex; align-items: center; }
        .style-7 .ad-item-desc { font-size: 11px; color: var(--text-secondary); line-height: 1.3; }

        /* STYLE 8: FADED NUMBERS (Крупные бледные цифры) */
        .style-8 .ad-text { font-size: 14px; color: var(--text-secondary); }
        .style-8 .ad-important { margin: 24px 0; padding: 0 10px; }
        .style-8 .ad-important-title { color: var(--danger-text); font-weight: 700; font-size: 12px; text-transform: uppercase; letter-spacing: 1px; display: block; margin-bottom: 8px; text-align: center; }
        .style-8 .ad-important-list { text-align: center; list-style: none; padding: 0; }
        .style-8 .ad-important-list li { margin-bottom: 6px; font-size: 13px; color: var(--text-primary); }
        .style-8 .ad-list-title { font-family: var(--font-display); font-weight: 800; font-size: 18px; margin: 40px 0 20px; color: var(--text-primary); text-align: center; }
        .style-8 .ad-item { position: relative; padding-left: 50px; margin-bottom: 24px; overflow: hidden; }
        .style-8 .ad-num-bg { position: absolute; left: -5px; top: -10px; font-size: 40px; font-weight: 900; color: var(--text-primary); opacity: 0.05; font-family: var(--font-display); line-height: 1; }
        .style-8 .ad-item-head { font-weight: 700; font-size: 14px; color: var(--text-primary); margin-bottom: 4px; position: relative; }
        .style-8 .ad-item-desc { font-size: 13px; color: var(--text-secondary); position: relative; }

        /* STYLE 9: ICONIC (С иконками) */
        .style-9 .ad-text { font-size: 14px; color: var(--text-secondary); border-left: 2px solid var(--border-color); padding-left: 12px; }
        .style-9 .ad-important { background: var(--card-active-bg); padding: 16px; border-radius: 12px; margin: 24px 0; display: flex; gap: 12px; }
        .style-9 .ad-important-icon { width: 24px; height: 24px; color: var(--accent-color); flex-shrink: 0; }
        .style-9 .ad-important-title { font-weight: 700; font-size: 13px; color: var(--text-primary); display: block; margin-bottom: 6px; }
        .style-9 .ad-list-title { font-family: var(--font-display); font-weight: 700; margin: 30px 0 16px; color: var(--text-primary); text-transform: uppercase; font-size: 13px; letter-spacing: 1px; }
        .style-9 .ad-item { display: flex; gap: 12px; margin-bottom: 16px; align-items: flex-start; }
        .style-9 .ad-icon { width: 18px; height: 18px; color: var(--danger-text); margin-top: 2px; flex-shrink: 0; }
        .style-9 .ad-item-head { font-weight: 600; font-size: 14px; color: var(--text-primary); }
        .style-9 .ad-item-desc { font-size: 13px; color: var(--text-secondary); margin-top: 2px; }

        /* STYLE 10: STEPS/TIMELINE (Вертикальная линия) */
        .style-10 .ad-text { font-size: 14px; color: var(--text-secondary); margin-bottom: 20px; }
        .style-10 .ad-important { border: 1px solid var(--accent-color); padding: 16px; border-radius: 0; margin: 24px 0; text-align: center; }
        .style-10 .ad-important-title { color: var(--accent-color); font-weight: 700; text-transform: uppercase; font-size: 12px; display: block; margin-bottom: 8px; }
        .style-10 .ad-list-title { font-family: var(--font-display); font-weight: 700; margin: 30px 0 20px; color: var(--text-primary); }
        .style-10 .ad-timeline { padding-left: 16px; border-left: 1px solid var(--border-color); margin-left: 8px; }
        .style-10 .ad-item { position: relative; margin-bottom: 24px; }
        .style-10 .ad-item::before { content: ''; position: absolute; left: -21px; top: 6px; width: 9px; height: 9px; background: var(--bg-color); border: 2px solid var(--text-secondary); border-radius: 50%; }
        .style-10 .ad-item-head { font-weight: 700; font-size: 14px; color: var(--text-primary); margin-bottom: 4px; }
        .style-10 .ad-item-desc { font-size: 13px; color: var(--text-secondary); }

    </style>
</head>
<body ontouchstart="">

<!-- ГЛАВНАЯ СТРАНИЦА (УПРОЩЕННАЯ ДЛЯ ПРИМЕРОЧНОЙ) -->
<div id="page-home" class="page">
    <div class="nav-bar" style="justify-content: center;">
        <span style="font-weight: 800; font-family: var(--font-display);">KINOCEKH</span>
        <div style="position: absolute; right: 16px;" onclick="toggleTheme()">
             <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="5"></circle><line x1="12" y1="1" x2="12" y2="3"></line><line x1="12" y1="21" x2="12" y2="23"></line><line x1="4.22" y1="4.22" x2="5.64" y2="5.64"></line><line x1="18.36" y1="18.36" x2="19.78" y2="19.78"></line><line x1="1" y1="12" x2="3" y2="12"></line><line x1="21" y1="12" x2="23" y2="12"></line><line x1="4.22" y1="19.78" x2="5.64" y2="18.36"></line><line x1="18.36" y1="5.64" x2="19.78" y2="4.22"></line></svg>
        </div>
    </div>
    <div style="padding: 20px;">
        <div class="card" style="background: var(--card-bg); padding: 20px; border-radius: 16px; border: 1px solid var(--border-color); cursor: pointer;" onclick="openPage('page-place-ads')">
            <h3 style="margin: 0 0 5px 0; font-family: var(--font-display);">Разместить рекламу</h3>
            <p style="margin: 0; font-size: 12px; color: var(--text-secondary);">Нажмите, чтобы открыть примерочную</p>
        </div>
    </div>
</div>

<!-- СТРАНИЦА: РАЗМЕСТИТЬ РЕКЛАМУ (ПРИМЕРОЧНАЯ) -->
<div id="page-place-ads" class="page sub-page">
    <div class="nav-bar">
        <button class="btn-back" onclick="closePage('page-place-ads')">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="15 18 9 12 15 6"></polyline></svg>
            Назад
        </button>
    </div>
    
    <div class="page-intro">
        <strong style="text-transform: uppercase; letter-spacing: 1px;">Реклама и Сотрудничество</strong>
        <p>Условия размещения коммерческих постов.</p>
    </div>

    <!-- ДИНАМИЧЕСКИЙ КОНТЕЙНЕР -->
    <div id="ad-content-container" class="ad-content-wrapper style-1">
        <!-- Контент генерируется JS, но структура ниже для примера -->
    </div>
</div>

<!-- ПАНЕЛЬ УПРАВЛЕНИЯ (FITTING ROOM) -->
<div id="fitting-panel">
    <div class="fp-title">Style Selector</div>
    <button class="fp-btn active" onclick="setStyle(1)">1. Clean Minimal</button>
    <button class="fp-btn" onclick="setStyle(2)">2. Cards Grid</button>
    <button class="fp-btn" onclick="setStyle(3)">3. Accent Line</button>
    <button class="fp-btn" onclick="setStyle(4)">4. Numbered Circles</button>
    <button class="fp-btn" onclick="setStyle(5)">5. Glass Panels</button>
    <button class="fp-btn" onclick="setStyle(6)">6. Typographic</button>
    <button class="fp-btn" onclick="setStyle(7)">7. Grid System</button>
    <button class="fp-btn" onclick="setStyle(8)">8. Faded Numbers</button>
    <button class="fp-btn" onclick="setStyle(9)">9. Iconic List</button>
    <button class="fp-btn" onclick="setStyle(10)">10. Timeline</button>
    
    <div class="fp-toggle" onclick="toggleTheme()">🌗 День / Ночь</div>
</div>

<script>
    // --- ДАННЫЕ (ТЕКСТ НЕИЗМЕНЕН) ---
    const adData = {
        intro: "Мы ценим интерес к нашему профессиональному сообществу и готовы рассмотреть предложения о размещении рекламы, соответствующей тематике группы.",
        cta: "Для согласования условий публикации, уточнения формата и сроков необходимо обратиться к администратору. Мы обеспечиваем цивилизованный подход к сотрудничеству и помогаем донести ваше предложение до целевой аудитории.",
        importantTitle: "Важно:",
        importantList: [
            "Размещение рекламы без предварительного согласования запрещено и влечёт за собой бан.",
            "Решение о публикации принимается администрацией на основе соответствия правилам группы."
        ],
        listTitle: "Направления, которые мы не продвигаем:",
        items: [
            { title: "1. Нецелевая тематика", desc: "Предложения, не связанные с кинопроизводством, кастингами, творческими или техническими услугами для киноиндустрии." },
            { title: "2. Личный пиар", desc: "Публикации, направленные исключительно на самопрезентацию («ищу работу», «смотрите моё портфолио», «готов к проектам»)." },
            { title: "3. Рисковые и финансовые услуги", desc: "Реклама криптовалют, трейдинга, инвестиций, букмекерских контор, азартных игр, микрофинансовых организаций и схожих сервисов." },
            { title: "4. Сомнительные или нелегитимные проекты", desc: "Любые предложения, нарушающие законодательство РФ или этические нормы сообщества." }
        ]
    };

    // --- РЕНДЕР КОНТЕНТА ---
    function renderContent(styleId) {
        const container = document.getElementById('ad-content-container');
        container.className = `ad-content-wrapper style-${styleId}`;
        
        let html = '';

        // 1. Вступление
        html += `<div class="ad-text">${adData.intro}</div>`;
        html += `<div class="ad-text">${adData.cta}</div>`;

        // 2. Блок Важно
        if (styleId === 9) {
            html += `<div class="ad-important">
                <div class="ad-important-icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M10.29 3.86L1.82 18a2 2 0 0 0 1.71 3h16.94a2 2 0 0 0 1.71-3L13.71 3.86a2 2 0 0 0-3.42 0z"></path><line x1="12" y1="9" x2="12" y2="13"></line><line x1="12" y1="17" x2="12.01" y2="17"></line></svg></div>
                <div>
                    <span class="ad-important-title">${adData.importantTitle}</span>
                    <ul style="margin:0; padding-left:16px; font-size:13px; color:var(--text-secondary);">
                        ${adData.importantList.map(li => `<li>${li}</li>`).join('')}
                    </ul>
                </div>
            </div>`;
        } else {
            html += `<div class="ad-important">
                <span class="ad-important-title">${adData.importantTitle}</span>
                <ul class="ad-important-list" style="margin:0; padding-left:20px; font-size:13px; color:var(--text-secondary);">
                    ${adData.importantList.map(li => `<li>${li}</li>`).join('')}
                </ul>
            </div>`;
        }

        // 3. Заголовок списка
        html += `<div class="ad-list-title">${adData.listTitle}</div>`;

        // 4. Список (Логика для разных стилей)
        if (styleId === 2 || styleId === 7) html += `<div class="ad-grid">`;
        else if (styleId === 10) html += `<div class="ad-timeline">`;
        else html += `<div>`;

        adData.items.forEach((item, index) => {
            // Очистка заголовка от цифр для стилей, где цифры отдельно
            const cleanTitle = item.title.replace(/^\d+\.\s*/, '');
            const num = index + 1;

            if (styleId === 4) {
                html += `<div class="ad-item">
                    <div class="ad-num">${num}</div>
                    <div class="ad-item-content">
                        <div class="ad-item-head">${cleanTitle}</div>
                        <div class="ad-item-desc">${item.desc}</div>
                    </div>
                </div>`;
            } else if (styleId === 8) {
                html += `<div class="ad-item">
                    <div class="ad-num-bg">${num}</div>
                    <div class="ad-item-head">${cleanTitle}</div>
                    <div class="ad-item-desc">${item.desc}</div>
                </div>`;
            } else if (styleId === 9) {
                html += `<div class="ad-item">
                    <svg class="ad-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"></circle><line x1="4.93" y1="4.93" x2="19.07" y2="19.07"></line></svg>
                    <div>
                        <div class="ad-item-head">${cleanTitle}</div>
                        <div class="ad-item-desc">${item.desc}</div>
                    </div>
                </div>`;
            } else {
                // Стандартный вывод (с цифрой в заголовке или без, зависит от стиля)
                // Для стилей 2, 5, 7, 10 лучше убрать цифру из заголовка и стилизовать иначе, но по ТЗ "текст не меняем".
                // Однако для визуальной чистоты в карточках я использую cleanTitle, так как цифра часто мешает верстке.
                // Если критично оставить "1. " в тексте, можно вернуть item.title.
                // В данном случае использую item.title для Style 1, 3, 6. Для остальных - cleanTitle для эстетики.
                
                const displayTitle = (styleId === 1 || styleId === 3 || styleId === 6) ? item.title : cleanTitle;
                
                html += `<div class="ad-item">
                    <div class="ad-item-head">${displayTitle}</div>
                    <div class="ad-item-desc">${item.desc}</div>
                </div>`;
            }
        });

        html += `</div>`; // Закрытие контейнера списка
        
        container.innerHTML = html;
    }

    // --- УПРАВЛЕНИЕ ---
    function setStyle(id) {
        document.querySelectorAll('.fp-btn').forEach(b => b.classList.remove('active'));
        document.querySelectorAll('.fp-btn')[id-1].classList.add('active');
        renderContent(id);
    }

    function toggleTheme() {
        const body = document.body;
        if (body.getAttribute('data-theme') === 'light') {
            body.removeAttribute('data-theme');
        } else {
            body.setAttribute('data-theme', 'light');
        }
    }

    function openPage(id) {
        document.getElementById(id).classList.add('active');
        document.getElementById('page-home').style.transform = "scale(0.95)";
        document.getElementById('page-home').style.opacity = "0.5";
        
        if(id === 'page-place-ads') {
            document.getElementById('fitting-panel').style.display = 'flex';
            renderContent(1); // Default style
        }
    }

    function closePage(id) {
        document.getElementById(id).classList.remove('active');
        document.getElementById('page-home').style.transform = "";
        document.getElementById('page-home').style.opacity = "";
        document.getElementById('fitting-panel').style.display = 'none';
    }

    // Init
    renderContent(1);
</script>

</body>
</html>
