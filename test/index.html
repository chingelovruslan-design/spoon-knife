<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>КИНОЦЕХ | Custom 3D Render</title>
    
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@500;700;800&display=block" rel="stylesheet">
    
    <style>
        :root {
            --bg-color: #0F0F11;
            --card-bg: #1C1C1E;
            --text-primary: #FFFFFF;
            --text-secondary: #9aa0a6;
            --accent: #D4AF37;
            
            /* Настройки 3D материала (меняются JS) */
            --mat-gradient: linear-gradient(135deg, #FFD700, #B8860B);
            --mat-shadow: 0 10px 20px rgba(0,0,0,0.4);
            --mat-border: none;
            --mat-filter: drop-shadow(0 5px 5px rgba(0,0,0,0.3));
            --mat-inset: inset 2px 2px 5px rgba(255,255,255,0.4), inset -2px -2px 5px rgba(0,0,0,0.2);
        }

        [data-theme="light"] {
            --bg-color: #F2F2F7;
            --card-bg: #FFFFFF;
            --text-primary: #000000;
            --text-secondary: #6e6e73;
            --accent: #007AFF;
        }

        body {
            margin: 0; padding: 0; background: var(--bg-color); color: var(--text-primary);
            font-family: 'Montserrat', sans-serif; overflow: hidden; transition: background 0.3s ease;
        }

        #app { padding: 16px; height: 100vh; overflow-y: auto; padding-bottom: 220px; }

        .header { margin-bottom: 24px; padding-top: 10px; }
        .brand { font-size: 24px; font-weight: 800; text-transform: uppercase; letter-spacing: 1px; }

        .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }

        .card {
            background: var(--card-bg); border-radius: 24px; padding: 18px; height: 150px;
            position: relative; overflow: hidden;
            display: flex; flex-direction: column; justify-content: space-between;
            transition: transform 0.2s;
            box-shadow: 0 4px 20px rgba(0,0,0,0.05);
        }
        .card.large { grid-column: span 2; height: 130px; flex-direction: row; align-items: center; }
        .card:active { transform: scale(0.97); }

        .card-info { position: relative; z-index: 2; pointer-events: none; max-width: 60%; }
        .card.large .card-info { max-width: 70%; }
        .card-title { font-size: 16px; font-weight: 700; line-height: 1.2; margin-bottom: 4px; }
        .card-desc { font-size: 11px; color: var(--text-secondary); font-weight: 500; }

        /* --- КОНТЕЙНЕР 3D ОБЪЕКТА --- */
        .scene-3d {
            position: absolute; right: 10px; bottom: 10px;
            width: 80px; height: 80px;
            perspective: 600px;
            pointer-events: none;
            transition: all 0.4s ease;
        }
        .card.large .scene-3d { right: 20px; bottom: auto; top: 50%; transform: translateY(-50%); width: 90px; height: 90px; }

        /* --- CSS 3D SHAPES (КОНСТРУКТОР) --- */
        .shape {
            position: absolute;
            background: var(--mat-gradient);
            box-shadow: var(--mat-shadow);
            border: var(--mat-border);
            filter: var(--mat-filter);
        }
        
        /* Внутренние тени для объема (Clay effect) */
        .clay-surface {
            box-shadow: var(--mat-inset);
        }

        /* 1. DOCUMENT (Правила) */
        .doc-base {
            width: 50px; height: 65px; top: 10px; left: 15px;
            border-radius: 8px; transform: rotate(-10deg);
        }
        .doc-line {
            position: absolute; left: 10px; height: 4px; background: rgba(255,255,255,0.3); border-radius: 2px;
        }
        .doc-corner {
            position: absolute; top: 0; right: 0; width: 15px; height: 15px;
            background: rgba(0,0,0,0.2); border-bottom-left-radius: 8px;
        }

        /* 2. PENCIL & PAPER (Объявление) */
        .paper-sheet {
            width: 45px; height: 55px; top: 15px; left: 10px;
            border-radius: 6px; transform: rotate(5deg);
        }
        .pencil-body {
            width: 10px; height: 60px; top: 5px; left: 45px;
            border-radius: 5px; transform: rotate(25deg);
            background: var(--accent); filter: brightness(1.2);
        }

        /* 3. MEGAPHONE (Реклама) */
        .mega-cone {
            width: 0; height: 0; top: 25px; left: 35px;
            border-top: 20px solid transparent;
            border-bottom: 20px solid transparent;
            border-right: 40px solid var(--accent);
            transform: rotate(-15deg); filter: var(--mat-filter);
        }
        /* Костыль для CSS конуса - используем border, но для Clay лучше div */
        .mega-body {
            width: 40px; height: 30px; top: 25px; left: 10px;
            border-radius: 8px 4px 4px 8px; transform: rotate(-15deg);
        }
        .mega-mouth {
            width: 15px; height: 40px; top: 20px; left: 45px;
            border-radius: 50%; transform: rotate(-15deg);
            background: rgba(255,255,255,0.2);
        }

        /* 4. SHIELD (Бригадиры) */
        .shield-shape {
            width: 50px; height: 60px; top: 10px; left: 15px;
            border-radius: 0 0 25px 25px;
            transform: rotate(0deg);
        }
        .shield-inner {
            position: absolute; top: 10px; left: 10px; right: 10px; bottom: 10px;
            border-radius: 0 0 15px 15px; background: rgba(0,0,0,0.1);
        }

        /* 5. BOOK (Статьи) */
        .book-cover {
            width: 50px; height: 60px; top: 10px; left: 15px;
            border-radius: 4px 8px 8px 4px;
            transform: rotate(-5deg);
        }
        .book-spine {
            position: absolute; left: 0; top: 0; bottom: 0; width: 8px;
            background: rgba(0,0,0,0.2); border-radius: 4px 0 0 4px;
        }

        /* --- ПАНЕЛЬ --- */
        .panel {
            position: fixed; bottom: 0; left: 0; width: 100%;
            background: rgba(20, 20, 22, 0.98); border-top: 1px solid rgba(255,255,255,0.1);
            padding: 20px; z-index: 100; border-radius: 24px 24px 0 0;
        }
        [data-theme="light"] .panel { background: #FFF; border-top: 1px solid rgba(0,0,0,0.1); }

        .panel-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 15px; }
        .panel-title { font-size: 12px; font-weight: 700; text-transform: uppercase; }
        .theme-btn { padding: 6px 12px; border-radius: 20px; background: rgba(128,128,128,0.2); border:none; font-weight:600; cursor: pointer; color: inherit; }

        .scroll-wrap { display: flex; gap: 10px; overflow-x: auto; padding-bottom: 10px; }
        .mat-btn {
            flex: 0 0 auto; width: 80px; height: 60px; border-radius: 12px;
            background: #2C2C2E; border: 2px solid transparent;
            display: flex; align-items: center; justify-content: center;
            font-size: 10px; font-weight: 700; color: #FFF; cursor: pointer;
            text-align: center; padding: 5px;
        }
        .mat-btn.active { border-color: var(--accent); }

    </style>
</head>
<body data-theme="dark">

<div id="app">
    <div class="header">
        <div class="brand">КИНОЦЕХ</div>
    </div>

    <div class="grid">
        <!-- 1. ПРАВИЛА -->
        <div class="card large">
            <div class="card-info">
                <div class="card-title">Правила группы</div>
                <div class="card-desc">Обязательно к ознакомлению</div>
            </div>
            <div class="scene-3d">
                <div class="shape doc-base clay-surface">
                    <div class="doc-line" style="top:15px; width:30px;"></div>
                    <div class="doc-line" style="top:25px; width:20px;"></div>
                    <div class="doc-line" style="top:35px; width:25px;"></div>
                    <div class="doc-corner"></div>
                </div>
            </div>
        </div>

        <!-- 2. ОБЪЯВЛЕНИЕ -->
        <div class="card">
            <div class="card-info">
                <div class="card-title">Разместить<br>объявление</div>
            </div>
            <div class="scene-3d">
                <div class="shape paper-sheet clay-surface"></div>
                <div class="shape pencil-body clay-surface"></div>
            </div>
        </div>

        <!-- 3. РЕКЛАМА -->
        <div class="card">
            <div class="card-info">
                <div class="card-title">Разместить<br>рекламу</div>
            </div>
            <div class="scene-3d">
                <div class="shape mega-body clay-surface"></div>
                <div class="shape mega-mouth clay-surface"></div>
            </div>
        </div>

        <!-- 4. БРИГАДИРЫ -->
        <div class="card" style="opacity:0.8">
            <div class="card-info">
                <div class="card-title">Проверенные<br>бригадиры</div>
                <div class="card-desc">Скоро</div>
            </div>
            <div class="scene-3d">
                <div class="shape shield-shape clay-surface">
                    <div class="shield-inner"></div>
                </div>
            </div>
        </div>

        <!-- 5. СТАТЬИ -->
        <div class="card" style="opacity:0.8">
            <div class="card-info">
                <div class="card-title">Полезные<br>статьи</div>
                <div class="card-desc">Скоро</div>
            </div>
            <div class="scene-3d">
                <div class="shape book-cover clay-surface">
                    <div class="book-spine"></div>
                </div>
            </div>
        </div>
    </div>
</div>

<div class="panel">
    <div class="panel-header">
        <div class="panel-title">Материал 3D (CSS Render)</div>
        <button class="theme-btn" onclick="toggleTheme()">День / Ночь</button>
    </div>
    <div class="scroll-wrap" id="mat-list"></div>
</div>

<script>
    // --- ВАРИАНТЫ МАТЕРИАЛОВ (CSS Variables) ---
    const MATERIALS = [
        {
            name: "1. VkusVill Clay",
            style: `
                --mat-gradient: linear-gradient(135deg, #F2F2F7, #E5E5EA);
                --mat-shadow: 0 8px 16px rgba(0,0,0,0.15);
                --mat-filter: drop-shadow(0 4px 4px rgba(0,0,0,0.1));
                --mat-inset: inset 4px 4px 10px rgba(255,255,255,1), inset -4px -4px 10px rgba(0,0,0,0.05);
            `,
            darkStyle: `
                --mat-gradient: linear-gradient(135deg, #3A3A3C, #2C2C2E);
                --mat-inset: inset 2px 2px 5px rgba(255,255,255,0.1), inset -2px -2px 5px rgba(0,0,0,0.3);
            `
        },
        {
            name: "2. Gold Bullion",
            style: `
                --mat-gradient: linear-gradient(135deg, #FFD700, #DAA520, #8B4513);
                --mat-shadow: 0 10px 25px rgba(218, 165, 32, 0.3);
                --mat-filter: drop-shadow(0 2px 2px rgba(0,0,0,0.5));
                --mat-inset: inset 0 0 20px rgba(255,215,0,0.5), inset 2px 2px 2px rgba(255,255,255,0.8);
            `
        },
        {
            name: "3. Yandex Gloss",
            style: `
                --mat-gradient: linear-gradient(135deg, #FFCC00, #FF9900);
                --mat-shadow: 0 10px 20px rgba(255, 153, 0, 0.3);
                --mat-filter: contrast(1.1);
                --mat-inset: inset 5px 5px 10px rgba(255,255,255,0.6), inset -2px -2px 5px rgba(0,0,0,0.1);
            `
        },
        {
            name: "4. Matte Plastic",
            style: `
                --mat-gradient: linear-gradient(135deg, #48484A, #1C1C1E);
                --mat-shadow: 0 15px 30px rgba(0,0,0,0.4);
                --mat-filter: none;
                --mat-inset: inset 1px 1px 2px rgba(255,255,255,0.1);
            `,
            lightStyle: `
                --mat-gradient: linear-gradient(135deg, #007AFF, #0056b3);
                --mat-inset: inset 2px 2px 5px rgba(255,255,255,0.3);
            `
        },
        {
            name: "5. Glassmorphism",
            style: `
                --mat-gradient: linear-gradient(135deg, rgba(255,255,255,0.4), rgba(255,255,255,0.1));
                --mat-shadow: 0 8px 32px 0 rgba(31, 38, 135, 0.37);
                --mat-border: 1px solid rgba(255, 255, 255, 0.18);
                --mat-filter: backdrop-filter: blur(4px);
                --mat-inset: none;
            `
        },
        {
            name: "6. Neon Cyber",
            style: `
                --mat-gradient: #000;
                --mat-shadow: 0 0 10px var(--accent), 0 0 20px var(--accent);
                --mat-border: 2px solid var(--accent);
                --mat-filter: brightness(1.5);
                --mat-inset: none;
            `
        },
        {
            name: "7. Soft Pastel",
            style: `
                --mat-gradient: linear-gradient(135deg, #FF9A9E, #FECFEF);
                --mat-shadow: 0 10px 20px rgba(255, 154, 158, 0.3);
                --mat-filter: none;
                --mat-inset: inset 3px 3px 6px rgba(255,255,255,0.8);
            `
        },
        {
            name: "8. Deep Space",
            style: `
                --mat-gradient: linear-gradient(135deg, #2b5876, #4e4376);
                --mat-shadow: 0 10px 20px rgba(0,0,0,0.5);
                --mat-filter: contrast(1.2);
                --mat-inset: inset 1px 1px 2px rgba(255,255,255,0.2);
            `
        },
        {
            name: "9. Holographic",
            style: `
                --mat-gradient: linear-gradient(135deg, #E0C3FC, #8EC5FC);
                --mat-shadow: 0 10px 20px rgba(142, 197, 252, 0.3);
                --mat-filter: hue-rotate(15deg);
                --mat-inset: inset 2px 2px 5px rgba(255,255,255,0.9);
            `
        },
        {
            name: "10. Pure White",
            style: `
                --mat-gradient: #FFFFFF;
                --mat-shadow: 0 20px 40px rgba(0,0,0,0.1);
                --mat-filter: none;
                --mat-inset: inset -5px -5px 10px rgba(0,0,0,0.05);
            `
        }
    ];

    const list = document.getElementById('mat-list');
    const root = document.documentElement;

    function applyMaterial(index) {
        const mat = MATERIALS[index];
        const isDark = document.body.getAttribute('data-theme') === 'dark';
        
        // Выбираем стиль (учитывая темную тему, если есть спец настройки)
        let styleString = mat.style;
        if (isDark && mat.darkStyle) styleString = mat.darkStyle;
        if (!isDark && mat.lightStyle) styleString = mat.lightStyle;

        // Парсим строку стилей и применяем к root
        styleString.split(';').forEach(rule => {
            if (rule.trim()) {
                const [prop, val] = rule.split(':');
                if (prop && val) root.style.setProperty(prop.trim(), val.trim());
            }
        });
    }

    // Генерация кнопок
    MATERIALS.forEach((m, i) => {
        const btn = document.createElement('div');
        btn.className = `mat-btn ${i === 0 ? 'active' : ''}`;
        btn.textContent = m.name;
        btn.onclick = () => {
            document.querySelectorAll('.mat-btn').forEach(b => b.classList.remove('active'));
            btn.classList.add('active');
            applyMaterial(i);
        };
        list.appendChild(btn);
    });

    function toggleTheme() {
        const body = document.body;
        const isDark = body.getAttribute('data-theme') === 'dark';
        body.setAttribute('data-theme', isDark ? 'light' : 'dark');
        
        // Переприменяем текущий материал, так как он может зависеть от темы
        const activeIndex = Array.from(document.querySelectorAll('.mat-btn')).findIndex(b => b.classList.contains('active'));
        applyMaterial(activeIndex !== -1 ? activeIndex : 0);
    }

    // Init
    applyMaterial(0);

</script>
</body>
</html>
