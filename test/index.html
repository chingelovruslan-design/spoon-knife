<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>KINOCEKH | Final Check</title>
    
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@500;700;800&display=block" rel="stylesheet">
    
    <style>
        /* --- БАЗА --- */
        :root {
            --font-main: 'Montserrat', sans-serif;
            
            /* DARK THEME (DEFAULT) */
            --bg-color: #0F0F11;
            --text-primary: #FFFFFF;
            --text-secondary: #9aa0a6;
            
            --card-bg: #1C1C1E;
            --card-border: #2C2C2E;
            
            /* ФИЛЬТР ДЛЯ НОЧИ (Твой выбор: Night/Slate) */
            /* Делаем иконки строгими, серо-синими, приглушенными */
            --icon-filter: hue-rotate(20deg) saturate(0.2) brightness(0.7);
        }

        /* LIGHT THEME */
        [data-theme="light"] {
            --bg-color: #F2F2F7;
            --text-primary: #000000;
            --text-secondary: #6e6e73;
            
            --card-bg: #FFFFFF;
            --card-border: #E5E5EA;
            
            /* ФИЛЬТР ДЛЯ ДНЯ (Оригинал) */
            /* Убираем фильтр, чтобы вернуть сочные цвета */
            --icon-filter: none;
        }

        body {
            margin: 0; padding: 0; background: var(--bg-color); color: var(--text-primary);
            font-family: var(--font-main); transition: background 0.3s ease, color 0.3s ease;
            overflow: hidden; -webkit-font-smoothing: antialiased;
        }

        #app { padding: 16px; height: 100vh; overflow-y: auto; padding-bottom: 120px; }

        .header { margin-bottom: 20px; padding-top: 10px; display: flex; justify-content: space-between; align-items: center; }
        .brand { font-size: 24px; font-weight: 800; text-transform: uppercase; letter-spacing: 1px; }

        /* --- СЕТКА (КОМПАКТНАЯ) --- */
        .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
        
        .card {
            background: var(--card-bg);
            border: 1px solid var(--card-border);
            border-radius: 18px;
            padding: 16px;
            position: relative;
            height: 115px; /* Компактная высота */
            overflow: hidden;
            display: flex; flex-direction: column; justify-content: space-between;
            transition: background 0.3s, border-color 0.3s;
        }
        .card:active { opacity: 0.8; transform: scale(0.98); transition: 0.1s; }
        .card.large { grid-column: span 2; height: 100px; flex-direction: row; align-items: center; }

        .card-text { position: relative; z-index: 2; max-width: 100%; }
        .card-title { font-size: 14px; font-weight: 700; line-height: 1.25; margin-bottom: 4px; text-transform: uppercase; }
        .card-sub { font-size: 10px; color: var(--text-secondary); font-weight: 500; }

        /* --- ИКОНКИ --- */
        .flat-icon {
            position: absolute;
            right: 8px; bottom: 8px;
            width: 65px; height: 65px;
            object-fit: contain;
            z-index: 1;
            pointer-events: none;
            
            /* ПРИМЕНЕНИЕ ФИЛЬТРА */
            filter: var(--icon-filter);
            transition: filter 0.4s ease; /* Плавный переход цвета */
        }

        /* --- ПАНЕЛЬ --- */
        .panel {
            position: fixed; bottom: 0; left: 0; width: 100%;
            background: var(--card-bg);
            border-top: 1px solid var(--card-border);
            border-radius: 24px 24px 0 0;
            padding: 20px; z-index: 100;
            padding-bottom: calc(20px + env(safe-area-inset-bottom));
            display: flex; justify-content: center;
        }
        
        .toggle-btn {
            background: var(--bg-color);
            border: 1px solid var(--card-border);
            color: var(--text-primary);
            padding: 12px 30px;
            border-radius: 12px;
            font-weight: 700;
            font-size: 14px;
            cursor: pointer;
            text-transform: uppercase;
            letter-spacing: 1px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.1);
        }

    </style>
</head>
<body data-theme="dark">

<div id="app">
    <div class="header">
        <div class="brand">КИНОЦЕХ</div>
    </div>

    <div class="grid">
        <!-- 1. ПРАВИЛА -->
        <div class="card large">
            <div class="card-text">
                <div class="card-title">Правила группы</div>
                <div class="card-sub">Обязательно к прочтению</div>
            </div>
            <img src="https://img.icons8.com/fluency/96/rules.png" class="flat-icon" alt="Rules">
        </div>

        <!-- 2. ОБЪЯВЛЕНИЕ -->
        <div class="card">
            <div class="card-text">
                <div class="card-title">Разместить<br>объявление</div>
            </div>
            <img src="https://img.icons8.com/fluency/96/create-new.png" class="flat-icon" alt="Post">
        </div>

        <!-- 3. РЕКЛАМА -->
        <div class="card">
            <div class="card-text">
                <div class="card-title">Разместить<br>рекламу</div>
            </div>
            <img src="https://img.icons8.com/fluency/96/megaphone.png" class="flat-icon" alt="Ads">
        </div>

        <!-- 4. БРИГАДИРЫ -->
        <div class="card" style="opacity: 0.7;">
            <div class="card-text">
                <div class="card-title">Проверенные<br>бригадиры</div>
                <div class="card-sub" style="margin-top:4px;">Скоро</div>
            </div>
            <img src="https://img.icons8.com/fluency/96/security-checked.png" class="flat-icon" alt="Brigadiers">
        </div>

        <!-- 5. СТАТЬИ -->
        <div class="card" style="opacity: 0.7;">
            <div class="card-text">
                <div class="card-title">Полезные<br>статьи</div>
                <div class="card-sub" style="margin-top:4px;">Скоро</div>
            </div>
            <img src="https://img.icons8.com/fluency/96/reading.png" class="flat-icon" alt="Articles">
        </div>
    </div>
</div>

<!-- ПАНЕЛЬ -->
<div class="panel">
    <button class="toggle-btn" onclick="toggleTheme()">Переключить: День / Ночь</button>
</div>

<script>
    function toggleTheme() {
        const body = document.body;
        const isDark = body.getAttribute('data-theme') === 'dark';
        const newTheme = isDark ? 'light' : 'dark';
        
        body.setAttribute('data-theme', newTheme);
        
        // Вибрация
        if(window.Telegram && Telegram.WebApp.HapticFeedback) {
            Telegram.WebApp.HapticFeedback.impactOccurred('medium');
            
            // Меняем цвет шапки Telegram
            if (newTheme === 'light') {
                Telegram.WebApp.setHeaderColor('#F2F2F7');
                Telegram.WebApp.setBackgroundColor('#F2F2F7');
            } else {
                Telegram.WebApp.setHeaderColor('#0F0F11');
                Telegram.WebApp.setBackgroundColor('#0F0F11');
            }
        }
    }

    // Инициализация
    if(window.Telegram) {
        Telegram.WebApp.ready();
        Telegram.WebApp.expand();
        Telegram.WebApp.setHeaderColor('#0F0F11');
        Telegram.WebApp.setBackgroundColor('#0F0F11');
    }
</script>

</body>
</html>
