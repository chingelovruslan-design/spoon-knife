<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">

    <title>КИНОЦЕХ | Примерочная</title>
    
    <!-- TELEGRAM API -->
    <script src="https://telegram.org/js/telegram-web-app.js"></script>

    <!-- ШРИФТЫ -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

    <style>
        /* --- ПЕРЕМЕННЫЕ (ОРИГИНАЛ) --- */
        :root {
            --font-display: 'Montserrat', sans-serif; 
            --font-body: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            --ease-spring: cubic-bezier(0.175, 0.885, 0.32, 1.1); 
            --ease-smooth: cubic-bezier(0.2, 0.8, 0.2, 1); 
            --duration-base: 0.3s;
            
            /* DARK THEME (DEFAULT) */
            --bg-color: #0F0F11;
            --card-bg: rgba(255, 255, 255, 0.04);
            --card-locked-bg: rgba(255, 255, 255, 0.02);
            --card-active-bg: rgba(255, 255, 255, 0.08);
            --border-color: rgba(255, 255, 255, 0.08);
            --glass-highlight: inset 0 1px 0 0 rgba(255, 255, 255, 0.15), inset 0 0 0 1px rgba(255,255,255,0.03);
            --card-shadow: var(--glass-highlight), 0 12px 40px -12px rgba(212, 175, 55, 0.15);
            --text-primary: #F2F2F2;
            --text-secondary: #9CA3AF;
            --text-locked: #52525b;
            --accent-color: #D4AF37; 
            --icon-color: #D4AF37;
            --icon-opacity: 0.25; 
            --icon-locked-color: #D4AF37;
            --icon-locked-opacity: 0.08;
        }

        /* LIGHT THEME */
        [data-theme="light"] {
            --bg-color: #F2F2F7;
            --card-bg: #FFFFFF;
            --card-locked-bg: #F5F5F7;
            --card-active-bg: #FFFFFF;
            --border-color: rgba(0, 51, 102, 0.15);
            --glass-highlight: inset 0 1px 0 0 rgba(255, 255, 255, 1), inset 0 0 0 1px rgba(0,0,0,0.02);
            --card-shadow: var(--glass-highlight), 0 12px 30px -10px rgba(0, 51, 102, 0.15);
            --text-primary: #1C1C1E;
            --text-secondary: #636366;
            --text-locked: #8E8E93;
            --accent-color: #003366; 
            --icon-color: #003366;
            --icon-opacity: 0.25;
            --icon-locked-color: #003366;
            --icon-locked-opacity: 0.08;
        }

        * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
        body {
            margin: 0; padding: 0; 
            background-color: var(--bg-color);
            color: var(--text-primary);
            font-family: var(--font-body);
            overflow: hidden;
            transition: background-color 0.3s ease, color 0.3s ease;
        }

        /* --- СТРУКТУРА --- */
        #app { padding: 20px; height: 100vh; overflow-y: auto; }
        
        .header { text-align: center; margin-bottom: 30px; padding-top: 20px; }
        .brand-title {
            font-family: var(--font-display); font-size: 30px; font-weight: 800; 
            letter-spacing: 2px; text-transform: uppercase;
            background: linear-gradient(to right, #bf953f, #fcf6ba, #b38728);
            -webkit-background-clip: text; background-clip: text; -webkit-text-fill-color: transparent;
        }
        [data-theme="light"] .brand-title {
            background: linear-gradient(to right, #003366, #4da6ff, #003366);
            -webkit-background-clip: text; background-clip: text; -webkit-text-fill-color: transparent;
        }

        .menu-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; padding-bottom: 100px; }
        
        .card {
            background: var(--card-bg); border: 1px solid var(--border-color); 
            box-shadow: var(--card-shadow);
            border-radius: 18px; padding: 18px; height: 130px; position: relative; overflow: hidden;
            transition: all 0.3s var(--ease-spring);
        }
        .card.large { grid-column: span 2; height: 110px; }
        .card.locked { background: var(--card-locked-bg); border-color: transparent; box-shadow: none; }
        
        .card-title { font-family: var(--font-display); font-size: 15px; font-weight: 700; position: relative; z-index: 2; text-transform: uppercase; }
        .card-desc { font-size: 11px; color: var(--text-secondary); margin-top: 6px; position: relative; z-index: 2; }
        
        /* --- ВОДЯНОЙ ЗНАК (ИКОНКА) --- */
        .card-watermark {
            position: absolute; right: 8px; bottom: 8px; width: 55px; height: 55px;
            color: var(--icon-color); opacity: var(--icon-opacity);
            transition: transform 0.4s var(--ease-spring), opacity 0.3s ease, color 0.6s ease; 
            z-index: 1; pointer-events: none;
        }
        .card.locked .card-watermark { color: var(--icon-locked-color); opacity: var(--icon-locked-opacity); }
        
        /* Анимация при нажатии (симуляция) */
        .card:active { transform: scale(0.97); }
        .card:active .card-watermark { transform: scale(1.1) rotate(-8deg); opacity: calc(var(--icon-opacity) + 0.15); }

        /* --- ПАНЕЛЬ ПРИМЕРОЧНОЙ --- */
        .fitting-room {
            position: fixed; top: 20px; right: 20px; bottom: 20px; width: 260px;
            background: rgba(15, 15, 17, 0.95);
            border: 1px solid rgba(255,255,255,0.1);
            backdrop-filter: blur(20px);
            border-radius: 20px;
            z-index: 9999;
            padding: 20px;
            display: flex; flex-direction: column;
            box-shadow: -10px 0 30px rgba(0,0,0,0.5);
            overflow-y: auto;
        }
        [data-theme="light"] .fitting-room {
            background: rgba(255, 255, 255, 0.95);
            border: 1px solid rgba(0,0,0,0.1);
        }

        .fr-header {
            font-family: var(--font-display); font-weight: 700; font-size: 14px;
            margin-bottom: 15px; text-transform: uppercase; letter-spacing: 1px;
            color: var(--text-primary); border-bottom: 1px solid var(--border-color); padding-bottom: 10px;
        }

        .fr-toggle-row {
            display: flex; align-items: center; justify-content: space-between;
            margin-bottom: 20px; background: var(--card-active-bg); padding: 10px; border-radius: 12px;
        }
        .fr-label { font-size: 12px; font-weight: 600; }
        
        /* Стилизованный свитч */
        .theme-switch {
            position: relative; width: 50px; height: 26px; background: #333; border-radius: 20px; cursor: pointer;
            transition: background 0.3s;
        }
        [data-theme="light"] .theme-switch { background: #e5e5ea; }
        .theme-switch::after {
            content: ''; position: absolute; top: 3px; left: 3px; width: 20px; height: 20px;
            background: #fff; border-radius: 50%; transition: transform 0.3s var(--ease-spring);
            box-shadow: 0 2px 5px rgba(0,0,0,0.2);
        }
        [data-theme="light"] .theme-switch::after { transform: translateX(24px); }

        .style-list { display: flex; flex-direction: column; gap: 8px; }
        .style-option {
            display: flex; align-items: center; gap: 10px;
            padding: 10px; border-radius: 10px; cursor: pointer;
            transition: background 0.2s; border: 1px solid transparent;
        }
        .style-option:hover { background: var(--card-active-bg); }
        .style-option.active { 
            background: var(--card-active-bg); 
            border-color: var(--accent-color); 
        }
        
        .radio-circle {
            width: 16px; height: 16px; border-radius: 50%; border: 2px solid var(--text-secondary);
            position: relative; flex-shrink: 0;
        }
        .style-option.active .radio-circle { border-color: var(--accent-color); }
        .style-option.active .radio-circle::after {
            content: ''; position: absolute; top: 2px; left: 2px; right: 2px; bottom: 2px;
            background: var(--accent-color); border-radius: 50%;
        }
        
        .opt-name { font-size: 12px; font-weight: 600; color: var(--text-primary); }
        .opt-desc { font-size: 10px; color: var(--text-secondary); display: block; }

        /* Адаптив для мобильных (панель вниз) */
        @media (max-width: 768px) {
            .fitting-room {
                top: auto; bottom: 0; left: 0; right: 0; width: 100%; height: 35vh;
                border-radius: 20px 20px 0 0; border-top: 1px solid var(--border-color);
            }
            #app { padding-bottom: 40vh; }
        }
    </style>
</head>

</div>

</div>

            desc: "Толстый контур + заливка",
            attrs: 'fill="currentColor" fill-opacity="0.2" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"',
            paths: {
                rules: '<path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"></path>',
                post: '<rect x="4" y="4" width="16" height="16" rx="2"></rect><path d="M12 8v8m-4-4h8" stroke="currentColor" stroke-width="3"></path>',
                ads: '<path d="M22 12L2 5v14l20-7z"></path>',
                brigadiers: '<path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"></path>',
                articles: '<path d="M4 19.5A2.5 2.5 0 0 1 6.5 17H20"></path><path d="M6.5 2H20v20H6.5A2.5 2.5 0 0 1 4 19.5v-15A2.5 2.5 0 0 1 6.5 2z"></path>'
            }
        }
    };

    // --- ЛОГИКА ПРИМЕРОЧНОЙ ---
    
    function renderStyleList() {
        const list = document.getElementById('style-list');
        Object.keys(iconsDB).forEach((key, index) => {
            const style = iconsDB[key];
            const item = document.createElement('div');
            item.className = `style-option ${index === 0 ? 'active' : ''}`;
            item.onclick = () => applyStyle(key, item);
            item.innerHTML = `
                <div class="radio-circle"></div>
                <div>
                    <div class="opt-name">${style.name}</div>
                    <span class="opt-desc">${style.desc}</span>
                </div>
            `;
            list.appendChild(item);
        });
    }

    function applyStyle(key, element) {
        // 1. UI Update
        document.querySelectorAll('.style-option').forEach(el => el.classList.remove('active'));
        if(element) element.classList.add('active');

        // 2. Apply Icons
        const styleData = iconsDB[key];
        const targets = {
            rules: document.getElementById('icon-rules'),
            post: document.getElementById('icon-post'),
            ads: document.getElementById('icon-ads'),
            brigadiers: document.getElementById('icon-brigadiers'),
            articles: document.getElementById('icon-articles')
        };

        for (const [type, container] of Object.entries(targets)) {
            if (container && styleData.paths[type]) {
                // Создаем SVG
                container.innerHTML = `
                    <svg viewBox="0 0 24 24" ${styleData.attrs}>
                        ${styleData.paths[type]}
                    </svg>
                `;
            }
        }
    }

    function toggleTheme() {
        const body = document.body;
        const label = document.getElementById('theme-label');
        const isDark = body.getAttribute('data-theme') === 'dark';
        
        if (isDark) {
            body.setAttribute('data-theme', 'light');
            label.textContent = 'День';
        } else {
            body.setAttribute('data-theme', 'dark');
            label.textContent = 'Ночь';
        }
    }

    // --- INIT ---
    window.onload = () => {
        renderStyleList();
        applyStyle('original'); // Default
    };

</script>
</body>
</html>
